server {
    listen 80;
    root /usr/share/nginx/html;

    # Runtime config must never be cached — it changes per deployment.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Vite build output. Every file name carries a content hash, so a file
    # never changes under the same name and browsers and CDNs can keep it
    # for a year. A missing file is a 404, not the SPA fallback: otherwise a
    # page from an older build asking for a removed bundle would get
    # index.html as 200 under a .js name, and a CDN could cache that.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry page names the current hashed bundles, so browsers must
    # revalidate it on every load to pick up a new deployment. Also serves
    # every SPA route through the fallback below.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
