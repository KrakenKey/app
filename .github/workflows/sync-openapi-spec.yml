name: Sync OpenAPI Spec to Marketing Site

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-openapi
  cancel-in-progress: true

jobs:
  sync-openapi:
    name: Generate and push OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout core-int
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: backend/yarn.lock

      - name: Install and build shared library
        working-directory: shared
        run: yarn install --frozen-lockfile --non-interactive && yarn build

      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Generate OpenAPI spec
        working-directory: backend
        env:
          KK_API_DOMAIN: api.krakenkey.io
          KK_API_VERSION: "0.1.0"
        run: yarn openapi:export

      # web's ruleset on main requires a pull request (0 approvals, squash
      # only), so a direct push is always rejected with GH013. Instead we
      # push a bot branch and squash-merge a PR, which lands immediately
      # under those rules. WEB_REPO_PAT needs contents and pull request
      # write access on KrakenKey/web.
      - name: Sync spec to web repo via pull request
        env:
          GH_TOKEN: ${{ secrets.WEB_REPO_PAT }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/KrakenKey/web.git /tmp/web
          cp backend/openapi.json /tmp/web/public/openapi.json
          cd /tmp/web
          if git diff --quiet public/openapi.json; then
            echo "No changes to OpenAPI spec. Skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/sync-openapi
          git add public/openapi.json
          git commit -m "chore: sync OpenAPI spec from app@${GITHUB_SHA::7}"
          # The ruleset only targets main, so force-pushing the bot branch is fine.
          git push --force origin bot/sync-openapi

          # Reuse the open sync PR if one exists, otherwise create it. REST
          # only: fine-grained PATs cannot call the GraphQL API that the
          # gh pr subcommands use ("Resource not accessible" otherwise).
          pr=$(gh api "repos/KrakenKey/web/pulls?head=KrakenKey:bot/sync-openapi&state=open" --jq '.[0].number' 2>/dev/null || true)
          if [ -z "${pr}" ] || [ "${pr}" = "null" ]; then
            pr=$(gh api repos/KrakenKey/web/pulls \
              -f title="chore: sync OpenAPI spec from app@${GITHUB_SHA::7}" \
              -f head=bot/sync-openapi \
              -f base=main \
              -f body="Automated sync of backend/openapi.json from KrakenKey/app@${GITHUB_SHA}." \
              --jq '.number')
          fi
          echo "Sync PR: https://github.com/KrakenKey/web/pull/${pr}"

          # Give GitHub a moment to compute mergeability, then squash-merge.
          # With 0 required approvals and no required checks this lands
          # immediately; if it ever cannot merge, fail loudly with the URL.
          sleep 5
          if ! gh api -X PUT "repos/KrakenKey/web/pulls/${pr}/merge" -f merge_method=squash > /dev/null; then
            echo "::error::Could not merge the sync PR automatically: https://github.com/KrakenKey/web/pull/${pr}"
            exit 1
          fi
          gh api -X DELETE repos/KrakenKey/web/git/refs/heads/bot/sync-openapi || true
