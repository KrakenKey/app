name: CI/CD — Build and Publish Frontend Image

on:
  push:
    branches: [main, "feature/*"]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - .github/workflows/frontend-docker-publish.yml
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - .github/workflows/frontend-docker-publish.yml
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install and build shared library
        working-directory: shared
        run: yarn install --frozen-lockfile --non-interactive && yarn build

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Lint
        continue-on-error: true # Existing issues, to be fixed in the future (non-blocking for now)
        working-directory: frontend
        run: yarn lint

      - name: Test
        working-directory: frontend
        run: yarn vitest --run

  build-and-push-frontend:
    name: Build and push Frontend Docker image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        env:
          # On a PR, tag sha-<head commit> rather than GitHub's merge commit, so
          # deploy-dev.yml can find the image from the PR head alone.
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=dev,enable=${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a push to main, prd only deploys if the merged PR was deployed to dev
  # (deploy/dev-deployed = success on its head commit, set by deploy-dev.yml).
  # A manual run on main is the deliberate override for a blocked prd.
  prd-gate:
    name: Check merged PR was deployed to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check dev-deployed status
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/dev-status-gate.sh deploy/dev-deployed

  prd-blocked:
    name: prd blocked (not deployed to dev)
    needs: [build-and-push-frontend, prd-gate]
    if: needs.prd-gate.result == 'success' && needs.prd-gate.outputs.allowed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        env:
          REASON: ${{ needs.prd-gate.outputs.reason }}
        run: |
          echo "::error::prd was not deployed: ${REASON}."
          echo "Dev was deployed from main. Once dev looks right, run this workflow manually on main to deploy prd."
          exit 1

  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: [build-and-push-frontend, prd-gate]
    if: >-
      !cancelled() &&
      needs.build-and-push-frontend.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: >-
          ${{
            github.ref == 'refs/heads/main' &&
              (github.event_name == 'workflow_dispatch' || needs.prd-gate.outputs.allowed == 'true')
              && fromJSON('["dev","prd"]')
            || fromJSON('["dev"]')
          }}
    steps:
      - name: Trigger infra deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_DEPLOY_PAT }}
          repository: KrakenKey/infra-int
          event-type: image-published
          client-payload: >-
            {"image": "${{ env.IMAGE_NAME }}", "sha": "${{ github.sha }}", "ref": "${{ github.ref_name }}", "environment": "${{ matrix.environment }}"}
